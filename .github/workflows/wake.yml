name: WakaTime Stat Update Everyday

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    # secrets.GH_TOKEN should be a classic Personal Access Token with "repo" and "user" scopes.
    # secrets.WAKATIME_API_KEY must be a valid WakaTime API key.
    # Missing or invalid credentials cause "HTTP 401: Bad credentials" failures in this job.
    steps:
      - uses: anmol098/waka-readme-stats@master
        continue-on-error: true
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          SHOW_PROJECTS: "False"
          SHOW_LINES_OF_CODE: "True"
          SHOW_LOC_CHART: "False"
          LOCALE: "en"
