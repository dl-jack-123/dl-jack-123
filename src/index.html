<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background: linear-gradient(var(--bg-top, #b8b9bb), var(--bg-bottom, #e5e6e7)) fixed;
      margin: 0;
    }


    /* warm tint over the scene. A CSS filter on the WebGL canvas made it disappear in Chrome, so use a blend layer instead. */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: var(--tint, #f1f1ef);
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 2;
    }

    #webgl {
      pointer-events: none;
    }

    #ui-app {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #ui {
      position: absolute;
      overflow: hidden;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #monitor-videos {
      pointer-events: none;
      position: 'absolute';
      opacity: 0;
      width: 0;
      height: 0;
      top: 0;
      left: 0;

    }

    #css {
      cursor: pointer;
    }

    #ui-interactive {
      position: absolute;
      top: 0;
      left: 0;
      width: 256px;
    }

    video {
      position: absolute;
      top: 0;
      pointer-events: none;
    }
  </style>

  <!-- Primary Meta Tags -->
  <title>DL.Chiu - Portfolio</title>
  <meta name="title" content="DL.Chiu - Software Engineer">
  <meta name="description"
    content="DL.Chiu. Python backend, data pipelines and trading bots, presented as an interactive 3D desk.">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dl-jack-123.github.io/dl-jack-123/">
  <meta property="og:title" content="DL.Chiu - Software Engineer">
  <meta property="og:description"
    content="DL.Chiu. Python backend, data pipelines and trading bots, presented as an interactive 3D desk.">

  <!-- Twitter -->


  <meta property="twitter:card" content="summary_large_image">
  <meta name="twitter:card" content="summary_large_image">

  <meta property="twitter:url" content="https://dl-jack-123.github.io/dl-jack-123/">
  <meta name="twitter:url" content="https://dl-jack-123.github.io/dl-jack-123/">

  <meta property="twitter:title" content="DL.Chiu - Software Engineer">
  <meta name="twitter:title" content="DL.Chiu - Software Engineer">

  <meta property="twitter:description"
    content="DL.Chiu. Python backend, data pipelines and trading bots, presented as an interactive 3D desk.">
  <meta name="twitter:description"
    content="DL.Chiu. Python backend, data pipelines and trading bots, presented as an interactive 3D desk.">


  <!-- Images -->

  <link rel="shortcut icon" href="../static/images/favicon.ico" type="image/x-icon">
</head>

<body>
  <div id="css"></div>
  <div id="webgl"></div>
  <div id="overlay"></div>
  <div id="ui-interactive"></div>
  <div id="ui"></div>
  <div id="ui-pro"></div>
  <div id="monitor-videos">
    <video id="video-1" muted loop autoplay width="0" height="0" src="../static/textures/monitor/video/base-static.mp4"
      style="opacity: 0;"></video>
    <video id="video-2" muted loop autoplay width="0" height="0"
      src="../static/textures/monitor/video/static-texture-layer.mp4" style="opacity: 0;"></video>
  </div>
</body>

</html>
